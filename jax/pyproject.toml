[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selectssm"
version = "0.1.0"
description = "Selective SSM (Mamba) with chunked, recursive, and custom-VJP scanning strategies, and the Mamba-3 complex-SSM RoPE trick, for JAX/Flax"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "flax>=0.7.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.20"]
tpu = ["jax[tpu]>=0.4.20"]
# Extras used by the test suite and the cross-language fixture generator.
test = ["pytest>=7.0", "optax>=0.1.7"]
fixtures = ["safetensors>=0.4.0", "optax>=0.1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer-running tests (e.g. the parity length-generalization training test)",
]
